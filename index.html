<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>8年级4班 · 体测冲刺工作台</title>
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#101a2b; --sub:#5c6b83;
  --line:#dde4ee; --line2:#eef2f8;
  --brand:#0f766e; --brand2:#14b8a6; --blue:#1d4ed8; --blue2:#3b82f6;
  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
  --warn:#b45309; --warnbg:#fef3c7; --infobg:#e0f2fe; --info:#075985;
  --r:14px; --sh:0 1px 2px rgba(16,26,43,.06),0 6px 18px rgba(16,26,43,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:64px;
}
.hdr{background:linear-gradient(118deg,#0f766e 0%,#115e59 42%,#1e3a8a 100%);color:#fff;padding:14px 16px 12px}
.hdr .wrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .brand{display:flex;align-items:center;gap:10px;min-width:0}
.hdr .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.hdr .sub{font-size:12px;opacity:.82;margin-top:1px}
.hdr .sp{flex:1 1 auto}
.hdr .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr input.cls{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:8px;padding:5px 9px;font-size:13px;width:118px;font-family:inherit}
.hdr input.cls::placeholder{color:rgba(255,255,255,.6)}
.hdr .hb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;
  padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.hdr .hb:hover{background:rgba(255,255,255,.24)}
.main-nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:0 1px 3px rgba(16,26,43,.04)}
.main-nav .wrap{max-width:1080px;margin:0 auto;display:flex;gap:5px;overflow-x:auto;padding:7px 12px;scrollbar-width:thin}
.main-nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--sub);border-radius:9px;
  padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.main-nav button:hover{background:var(--line2);color:var(--ink)}
.main-nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sub-nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:45px;z-index:29}
.sub-nav .wrap{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 12px}
.sub-nav button{flex:none;background:transparent;border:none;color:var(--sub);border-radius:7px;padding:4px 11px;
  font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.sub-nav button.on{background:var(--infobg);color:var(--info);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:16px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 17px;margin-bottom:14px}
.card.tight{padding:12px 13px}
.card>h2,.ct{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .n,.ct .n{background:var(--brand);color:#fff;font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:700}
.ct .s{font-size:12.5px;color:var(--sub);font-weight:400}
h3.bt{font-size:14.5px;font-weight:700;margin:14px 0 8px;color:var(--brand);padding-left:9px;border-left:3px solid var(--brand2)}
h4.st{font-size:13.5px;font-weight:700;margin:11px 0 6px;color:var(--ink)}
p{margin-bottom:9px}
.muted{color:var(--sub);font-size:13px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:9px 0 13px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th,td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f3f6fb;font-weight:700;color:#33425c;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:none}
th:last-child,td:last-child{border-right:none}
tbody tr:nth-child(even){background:#fafcfe}
table .c{text-align:center}
.pill{display:inline-block;border-radius:999px;padding:1.5px 9px;font-size:11.5px;font-weight:700;line-height:1.6;white-space:nowrap}
.p-a{background:#dcfce7;color:#15803d}
.p-b{background:#dbeafe;color:#1d4ed8}
.p-c{background:#fef3c7;color:#b45309}
.p-w{background:#f1f5f9;color:#475569}
.p-d{background:#fee2e2;color:#b91c1c}
.p-x{background:#ede9fe;color:#6d28d9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{background:#f7fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--brand);line-height:1.25}
.stat span{font-size:12px;color:var(--sub)}
button.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:8px 15px;font-size:13.5px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
button.btn:hover{filter:brightness(1.08)}
button.btn.g{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
button.btn.b{background:var(--blue)}
button.btn.d{background:#fff;color:var(--bad);border:1.5px solid #f0b4b4}
button.btn.s{padding:5px 11px;font-size:12.5px;border-radius:8px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.toolbar .sp{flex:1}
input.f,select.f{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px;font-family:inherit;
  background:#fff;color:var(--ink);min-width:0}
input.f:focus,select.f:focus{outline:2px solid var(--brand2);outline-offset:-1px}
input.f.sm{padding:4px 7px;font-size:12.5px;border-radius:7px}
.tip{border-radius:11px;padding:11px 13px;font-size:13.2px;line-height:1.72;margin:10px 0;border:1px solid}
.tip.good{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.tip.warn{background:var(--warnbg);border-color:#fcd34d;color:#78350f}
.tip.info{background:var(--infobg);border-color:#bae6fd;color:#0c4a6e}
.tip b{font-weight:700}
.countdown{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(115deg,#0f766e,#115e59 55%,#1e3a8a);color:#fff;border-radius:var(--r);padding:17px 19px;box-shadow:var(--sh)}
.countdown .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.countdown .big small{font-size:15px;font-weight:600;opacity:.85;margin-left:3px}
.countdown .txt{font-size:13.5px;opacity:.93;line-height:1.66}
.seg{display:inline-flex;background:#f1f5f9;border-radius:9px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;border-radius:7px;padding:4px 11px;font-size:12.5px;cursor:pointer;
  font-family:inherit;color:var(--sub);font-weight:600}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(16,26,43,.1)}
.ab{border:1.2px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;font-size:12.5px;cursor:pointer;
  font-family:inherit;color:var(--sub);font-weight:700;margin-right:4px;min-width:32px}
.ab:hover{border-color:var(--brand2)}
.ab.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ab.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.ab.on-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.ab.on-info{background:var(--blue);border-color:var(--blue);color:#fff}
.ck{width:30px;height:26px;border:1.4px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;
  font-size:15px;line-height:1;color:#c3ccdb;font-family:inherit;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:9px;background:#e6ecf4;border-radius:999px;overflow:hidden;margin:7px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:999px;transition:width .25s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;
  cursor:pointer;font-family:inherit;color:var(--sub)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.to-do{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:#fff}
.to-do.done{background:#f6fdf8;border-color:#bbf7d0}
.to-do .cbx{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--line);background:#fff;cursor:pointer;
  flex:none;margin-top:1px;font-size:14px;color:#c3ccdb;font-family:inherit;padding:0}
.to-do .cbx.on{background:var(--ok);border-color:var(--ok);color:#fff}
.to-do .bd{flex:1;min-width:0}
.to-do .t1{font-weight:700;font-size:14px}
.to-do .t2{font-size:12.5px;color:var(--sub);margin-top:2px}
.to-do.done .t1{text-decoration:line-through;opacity:.62}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#101a2b;color:#fff;
  padding:10px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.24s;z-index:200;
  max-width:88vw;text-align:center}
#toast.show{opacity:.96;transform:translate(-50%,0)}
#modalHost{position:fixed;inset:0;background:rgba(12,18,30,.5);display:none;z-index:150;padding:18px;overflow:auto}
#modalHost.on{display:flex;align-items:flex-start;justify-content:center}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.modal .mh{padding:14px 17px;border-bottom:1px solid var(--line);font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px}
.modal .mb{padding:15px 17px;max-height:66vh;overflow:auto;font-size:13.6px}
.modal .mf{padding:12px 17px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#fafcfe;flex-wrap:wrap}
.modal textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;
  font-family:ui-monospace,Consolas,monospace;font-size:12.4px;line-height:1.6;resize:vertical;color:var(--ink)}
.x{background:transparent;border:none;font-size:21px;cursor:pointer;color:var(--sub);line-height:1;padding:0 4px;font-family:inherit}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:13.3px}
.kv b{color:var(--sub);font-weight:600}
.slot{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:13px}
.slot>.sh{background:#f3f6fb;padding:9px 13px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot>.sh .tag{background:var(--brand);color:#fff;font-size:11.5px;border-radius:6px;padding:1px 8px}
.slot>.sb{padding:11px 13px}
.daynav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.daynav .ttl{font-weight:700;font-size:15px;flex:1;min-width:150px}
.ch-note{font-size:13.2px;color:var(--sub);background:#f7fafc;border-left:3px solid var(--brand2);border-radius:0 9px 9px 0;padding:9px 12px;margin:9px 0}
ul.li,ol.li{margin:7px 0 11px 20px}
ul.li li,ol.li li{margin-bottom:5px;font-size:13.6px}
.print-only{display:none}
.foot{max-width:1080px;margin:0 auto;padding:14px 15px 0;color:var(--sub);font-size:12px;text-align:center;line-height:1.8}
@media screen and (max-width:560px){
  /* 详案表在窄屏改成一格一行的卡片，免得「组数／用时」被裁掉要横滑。
     注意必须限定 screen —— 否则打印时若视口被判定为窄屏，表格会散成卡片。 */
  .rt-wrap{ border:none; margin:6px 0 4px }
  table.rt thead{ display:none }
  table.rt, table.rt tbody, table.rt tr, table.rt td{ display:block; width:auto; border:none }
  table.rt tr{ border:1px solid var(--line); border-radius:10px; padding:7px 10px; margin-bottom:7px; background:#fff!important }
  table.rt td{ padding:2px 0; font-size:13.2px; border-right:none }
  table.rt td:before{
    content:attr(data-l); display:inline-block; min-width:66px; font-weight:700;
    color:var(--brand); margin-right:7px; vertical-align:top
  }
  table.rt td:first-child{ font-weight:700 }
  table.rt td:first-child:before{ color:var(--sub) }
}
@media screen and (max-width:520px){
  body{font-size:14.5px}
  main{padding:12px 10px 0}
  .card{padding:13px 12px}
  .hdr h1{font-size:15.5px}
  .hdr input.cls{width:96px}
  table{font-size:12.4px}
  th,td{padding:6px 7px}
  .countdown .big{font-size:36px}
}
@media print{
  .main-nav,.sub-nav,.hdr .ctrl,.toolbar,.no-print{display:none!important}
  body{background:#fff;font-size:10.5pt;padding:0}
  .card{box-shadow:none;border:1px solid #999;margin-bottom:8px;break-inside:auto}
  .print-only{display:block;font-size:10pt;color:#333;border-bottom:1px solid #999;padding-bottom:5px;margin-bottom:8px}
  .tw{overflow:visible;border-color:#999}
  table{font-size:9.6pt}
  th,td{padding:4px 7px}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{white-space:nowrap}
  th{white-space:normal}
  .pill,.tag,.ck,.to-do .cbx,.ab{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pb{page-break-after:always}
  .pb:last-child{page-break-after:auto}
  a{color:#000;text-decoration:none}
}
</style>
</head>

运动"],["<strong>已测完的当天<\/strong>","慢跑800米排酸＋静态拉伸8组＋互相踩腿；回家热水泡脚"],["<strong>不测的时段<\/strong>","正常上课，不安排额外体育训练，避免疲劳累积"]]}}]},{"title":"六、周末打卡作业（4天，可直接发家长群）","blocks":[{"t":"p","c":"<strong>打卡规则<\/strong>：每项做完拍1张照片或10秒小视频发班级群；按模板回复\"学号＋姓名＋完成\"；家长在纸质打卡表上签字；出现疼痛、头晕、胸闷立即停止并告诉家长。不追求快，追求\"做完\"和\"每天做\"。"},{"t":"h3","c":"打卡① ｜ 10月17日（周六）：有氧＋跳绳"},{"t":"table","d":{"head":["序号","内容","量","要求"],"rows":[["1","热身（原地小跳、手腕脚踝绕环、高抬腿）","3—5分钟","身体微微发热才算热身到位"],["2","慢跑／快走","20分钟","强度以\"能一边跑一边说话\"为准；走跑交替也算完成"],["3","1分钟跳绳","3组（组间休1分钟）","记录3组个数，填进打卡表"],["4","全身拉伸","8分钟","大腿前后侧、小腿、臀部、腰背，每个30秒"]]}},{"t":"h3","c":"打卡② ｜ 10月18日（周日）：柔韧＋核心"},{"t":"table","d":{"head":["序号","内容","量","要求"],"rows":[["1","热身（原地小跳＋慢走）","3分钟","先热再拉"],["2","坐位体前屈（并腿前屈／分腿前屈／跨栏步拉伸）","每动作30秒×3轮","慢慢加深、不弹震；能拉多少算多少"],["3","仰卧单腿拉伸（用跳绳勾脚）","左右各30秒×2轮","感觉\"绷\"但不\"疼\""],["4","平板支撑","3组×30—45秒","腰不塌、臀不翘"],["5","仰卧起坐","3组×20个","肩胛离垫、肘碰膝"],["6","臀桥","2组×15个","顶到最高停1秒"]]}},{"t":"h3","c":"打卡③④ ｜ 10月24日、25日：恢复与休息"},{"t":"p","c":"具体内容见上方\"10月24日（周六）·打卡③\"与\"10月25日（周日）·打卡④\"两节。"},{"t":"h3","c":"给C组同学的周末调整（减量版）"},{"t":"p","c":"打卡①的慢跑改为<strong>快走15分钟＋慢跑5分钟<\/strong>；打卡②的仰卧起坐改为<strong>2组×15个<\/strong>；其余照做。重点是\"每天都动一下\"，不要因为做不完就放弃打卡。"},{"t":"h3","c":"周末打卡记录表（打印裁剪，一人一张）"},{"t":"table","d":{"head":["姓名","10/17 有氧＋跳绳","10/18 柔韧＋核心","10/24 恢复日","10/25 休息＋睡眠","家长签字"],"rows":[["","","","","",""],["","","","","",""],["","","","","",""]]}},{"t":"p","c":"填写方式：完成画\"√\"，跳绳个数写数字，未完成写\"×\"并注明原因（生病／事假）；有疼痛、头晕等情况必须在备注栏写明。"}]},{"title":"七、体测前的\"乳酸堆积\"应对（含常见误解纠正）","blocks":[{"t":"p","c":"这一节解释体测前为什么要减量、减量具体怎么做。理解了原理，执行时才不会因为\"感觉没练够\"而临时加课。"},{"t":"h3","c":"1. 先纠正一个常见误解"},{"t":"p","c":"很多同学和老师以为\"跑完第二天腿酸，是乳酸堆在那里了\"。<strong>其实不是。<\/strong>"},{"t":"p","c":"乳酸在运动结束后1—2小时内就会被代谢清除干净，<strong>不会\"堆\"到第二天<\/strong>。第二天、第三天那种\"下楼梯腿软、按着酸疼\"的感觉，医学上叫<strong>延迟性肌肉酸痛（DOMS）<\/strong>，是肌肉纤维轻微损伤的修复反应，<strong>高峰期在运动后24—72小时<\/strong>。"},{"t":"p","c":"这对体测意味着什么？如果体测前1—2天还练了大强度，体测当天正好撞上酸痛高峰——腿是沉的、发力发不出来，成绩比平时还差。所以<strong>真正要防的不是乳酸，而是别让酸痛高峰落在体测那天<\/strong>。"},{"t":"h3","c":"2. 三个时间点，做对三件事"},{"t":"table","d":{"head":["时间点","做什么","为什么"],"rows":[["日常每次课后","慢走5—10分钟＋静态拉伸10分钟（不是马上坐下聊天）","慢走时肌肉持续收缩，帮助血液带走代谢产物，比静止休息清除效率高得多；拉伸能减轻后面的酸痛感"],["10月23日下午起（体测前48—72小时）","停止一切大强度训练，只做低强度有氧加拉伸","肌肉有48—72小时完成修复，才能\"超量恢复\"，体测时反而比训练时更有力（专业队赛前都这么减量）"],["体测当天早上","提前1.5小时清淡早餐→热身15分钟（慢跑3分钟＋动态拉伸＋30米加速跑×2）→项目间慢走补水","热身不足容易拉伤；热身过度（湿透出汗）会提前消耗体力。目标是身体热了、心跳上来了，但不觉得累"]]}},{"t":"h3","c":"3. 如果体测前已经酸痛了，怎么办"},{"t":"table","d":{"head":["类别","具体操作"],"rows":[["<strong>要做的<\/strong>","热敷10—15分钟；轻度活动（慢走、慢跑5—10分钟）；徒手按摩或泡沫轴滚压（每个部位30—60秒，痛点停15秒）；早睡"],["<strong>别做的<\/strong>","完全躺着不动（越不动越僵越酸）；继续大强度训练；用力按压疼得厉害的部位；洗很热的水澡后立刻外出"],["<strong>要报告的<\/strong>","某个点的刺痛、关节痛、按压有明确痛点、肿胀——那不是酸痛，可能是拉伤，立即报告老师并停止训练"]]}}]},{"title":"八、安全底线与课堂管理（建议打印一份放办公室）","blocks":[{"t":"p","c":"10天短周期里，最大的风险不是练得不够，而是练出伤病。本节把开训前排查、课中应急、每日负荷监控一次列清。"},{"t":"h3","c":"1. 必须提前排查的人（10月16日当天完成）"},{"t":"table","d":{"head":["情况","处理方式"],"rows":[["有哮喘、心脏病、癫痫史","单独列出名单，不做极限强度，随身带药，通知校医与家长"],["近期膝、踝、腰有伤或刚痊愈","跳类、跑类减量或改为快走、上肢练习；不做深蹲跳"],["超重／体型明显偏大","减少跳跃与连续跑量（关节负荷大），用快走加慢跑交替替代长跑；不做当众体重讨论"],["免测（原表\"＃\"标记）、请假","按学校规定执行；在场时安排计数、计时、收器材等任务"],["女生生理期","不做跑步、跳跃，改为主持热身、计数、拉伸指导；以学生自己申报为准，不做盘问"]]}},{"t":"h3","c":"2. 出现以下情况，立即停止并送医"},{"t":"p","c":"立即停止的信号：头晕、眼前发黑；胸闷胸痛；面色苍白或发青；恶心呕吐；关节扭伤后不能负重；意识模糊、反应迟钝；大量出汗后突然不出汗（热射病先兆）。"},{"t":"p","c":"<strong>处理口诀<\/strong>：停→扶到阴凉处坐下或平卧→松解开领口→补水→通知校医和家长→需要时拨打120。老师全程陪同，不让学生独自离开。"},{"t":"h3","c":"3. 场地与器材快速检查（每天课前1分钟）"},{"t":"p","c":"跑道有无积水、砂石、坑洼；边界有无障碍物。跳绳长度是否合适（双脚踩绳中间，绳柄到腋下）；绳体有无破损。垫子是否平整、有无滑动；单杠是否稳固（引体向上前必须两人检查）。备好急救箱、冰袋、弹力绷带；广东10月仍偏热，备足饮用水。"},{"t":"h3","c":"4. 教师用的负荷监控表（贴在办公室）"},{"t":"table","d":{"head":["监控项","怎么看","预警信号"],"rows":[["主观疲劳（RPE）","课后问一句\"累不累，1—10分\"","连续2天≥8分"],["睡眠","课上随口问","入睡困难、易醒"],["肌肉酸痛","每天问\"腿还酸吗\"","持续超48小时"],["训练意愿","看集合速度、表情","明显抗拒、躲课"],["成绩表现","看当天练习完成质量","连续3天明显下降"]]}},{"t":"p","c":"<strong>减量原则<\/strong>：出现3项及以上，当天该生减量一半，不要硬顶。10天短周期里，\"不受伤、不生病\"比\"多练一次\"重要得多。"}]},{"title":"九、测试当天注意事项（可发家长群）","blocks":[{"t":"p","c":"1. 穿平时训练穿惯的运动鞋（<strong>不要穿新鞋<\/strong>）、宽松衣裤，不戴首饰；天凉加外套，测完及时穿上。"},{"t":"p","c":"2. 提前上厕所；测试前30分钟做完准备活动，保持身体微热。"},{"t":"p","c":"3. 长跑战术：A组按目标配速匀速领跑；B组跟住前面的人，最后200米冲刺；C组匀速＋走跑结合，坚持不停。"},{"t":"p","c":"4. 跑完不要立刻坐下或喝水，先慢走1—2圈、抖腿、深呼吸。"},{"t":"p","c":"5. 心态：模拟测试已经练过全程，把平时练的跑出来就是赢。"}]},{"title":"十、最后提醒三句话","blocks":[{"t":"p","c":"1. <strong>10月23日下午是终点线<\/strong>——之后谁都不能练大强度，老师也别临时加课。"},{"t":"p","c":"2. <strong>上午课别练到喘不上气<\/strong>——学生回教室还要上两节课，练废了后面全耽误。"},{"t":"p","c":"3. <strong>C组要的是\"完成\"，不是\"成绩\"<\/strong>——10天能让他们从\"不敢跑\"变成\"敢跑完\"，这份价值比多拿2分大得多。"}]},{"title":"附：配套文件","blocks":[{"t":"p","c":"1. <strong>《8年级4班体测训练分组与打卡表.xlsx》<\/strong>：分组名单表（47人，含训练配速、跳绳专项标记）／每日训练记录表（热身、分组练习、组数强度、放松分列）／周末打卡统计表（自动计完成率）／<strong>待补测与待确认清单（逐项打钩）<\/strong>。"},{"t":"p","c":"2. 补测与字迹核对完成后，把确认版名单发回，我按确认数据重算分组、配速与训练量。"}]}]}</script>
<script>
/* ============================================================
   8年级4班 · 体测冲刺工作台  —— 单文件离线版
   数据来源：整合版训练方案 + 体测训练分组与打卡表
   ============================================================ */

/* ---------- 0. 静态数据（内嵌 seed，不随保存变化） ---------- */
var SEED = JSON.parse(document.getElementById('SEED').textContent);
var CH = SEED.chapters || [];
var STU = SEED.students || [];
var DAILY = SEED.daily || [];
var PLAN = SEED.plan || [];
var PLANHEAD = SEED.planHead || [];
var TODOS = SEED.todos || [];
var CKITEMS = SEED.checkinItems || [];
var SSET = SEED.settings || {};

var LSKEY = 'pe_tc_wb_v1';
var ATT_MARKS = [
  { v: '出', cls: 'on-ok', t: '到' },
  { v: '缺', cls: 'on-bad', t: '缺' },
  { v: '病', cls: 'on-warn', t: '病' },
  { v: '事', cls: 'on-info', t: '事' }
];
var GROUP_ORDER = ['男A', '男B', '男C', '女A', '女B', '女C', '待测', '免测待核'];

/* ---------- 1. 工具函数 ---------- */
function $(id){ return document.getElementById(id); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function iso(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){
  var p = String(s).split('-');
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
}
function diffDays(a, b){
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function monthDay(s){
  var d = parseISO(s);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function dowCN(s){
  var w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return w[parseISO(s).getDay()];
}
function nz(v){ return (v === null || v === undefined) ? '' : String(v).trim(); }
function uniq(arr){
  var o = [], seen = {};
  for (var i = 0; i < arr.length; i++){
    var k = String(arr[i]);
    if (!seen[k]){ seen[k] = 1; o.push(arr[i]); }
  }
  return o;
}
function grpCls(g){
  var s = String(g);
  if (s.indexOf('A') >= 0) return 'p-a';
  if (s.indexOf('B') >= 0) return 'p-b';
  if (s.indexOf('C') >= 0) return 'p-c';
  if (s.indexOf('免测') >= 0) return 'p-x';
  if (s.indexOf('待测') >= 0) return 'p-d';
  return 'p-w';
}
function grpSort(a, b){
  var ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
  if (ia < 0) ia = 99;
  if (ib < 0) ib = 99;
  return ia - ib || String(a).localeCompare(String(b));
}

/* ---------- 2. 运行时数据层 ---------- */
var D = null;
var UI = { page: 'home', attendDate: '', attendSlot: '上午', rosterFilter: '', rosterKey: '', ckFilter: 'all', docCh: 0 };
var ATTDATES = [];

function blankData(){
  return {
    settings: {
      className: SSET.className || '8年级4班',
      school: SSET.school || '',
      examStart: SSET.examStart || '2026-10-26',
      trainStart: SSET.trainStart || '2026-10-16'
    },
    attendance: {},   /* 'date|slot' -> { sid: '出'|'缺'|'病'|'事' } */
    attNote: {},      /* 'date|slot' -> '备注' */
    checkin: {},      /* sid -> [0/1,0/1,0/1,0/1] */
    scores: {},       /* sid -> {run, rope, sit, jump, note} */
    todoDone: {},     /* id -> true */
    todoResult: {},   /* id -> '处理结果' */
    meta: { updated: '' }
  };
}
function ensureFields(){
  if (!D.settings) D.settings = blankData().settings;
  var d = blankData().settings, k;
  for (k in d){ if (D.settings[k] === undefined) D.settings[k] = d[k]; }
  if (!D.attendance) D.attendance = {};
  if (!D.attNote) D.attNote = {};
  if (!D.checkin) D.checkin = {};
  if (!D.scores) D.scores = {};
  if (!D.todoDone) D.todoDone = {};
  if (!D.todoResult) D.todoResult = {};
  if (!D.meta) D.meta = { updated: '' };
}
function load(){
  var raw = null;
  try { raw = localStorage.getItem(LSKEY); } catch (e){ raw = null; }
  if (raw){
    try { D = JSON.parse(raw); } catch (e){ D = null; }
  }
  if (!D || typeof D !== 'object') D = blankData();
  ensureFields();
}
function save(){
  D.meta.updated = new Date().toLocaleString('zh-CN');
  try { localStorage.setItem(LSKEY, JSON.stringify(D)); }
  catch (e){ toast('保存失败：浏览器存储空间不足或被禁用'); }
}

/* ---------- 3. 计算核心 ---------- */
function attKey(dt, slot){ return dt + '|' + slot; }
/* ro=true 为只读：渲染页面时不得往数据里塞空容器（否则备份文件被垃圾撑大） */
function getAtt(dt, slot, ro){
  var k = attKey(dt, slot);
  if (!D.attendance[k]){
    if (ro) return {};
    D.attendance[k] = {};
  }
  return D.attendance[k];
}
function attStat(dt, slot){
  var a = getAtt(dt, slot, true), c = { '出': 0, '缺': 0, '病': 0, '事': 0, '未': 0 };
  for (var i = 0; i < STU.length; i++){
    var v = a[STU[i].sid];
    if (v && c[v] !== undefined) c[v]++; else c['未']++;
  }
  return c;
}
function checkRow(sid, ro){
  var r = D.checkin[sid];
  if (!(r instanceof Array)){
    if (ro){
      var t = [];
      for (var z = 0; z < CKITEMS.length; z++) t.push(0);
      return t;
    }
    r = [];
    D.checkin[sid] = r;
  }
  while (r.length < CKITEMS.length) r.push(0);
  return r;
}
function checkCount(sid){
  var r = checkRow(sid, true), n = 0;
  for (var i = 0; i < CKITEMS.length; i++){ if (r[i]) n++; }
  return n;
}
function checkRate(sid){
  var t = CKITEMS.length || 1;
  return checkCount(sid) / t;
}
function checkTotals(){
  var full = 0, part = 0, zero = 0, sum = 0;
  for (var i = 0; i < STU.length; i++){
    var n = checkCount(STU[i].sid);
    sum += n;
    if (n === CKITEMS.length) full++; else if (n === 0) zero++; else part++;
  }
  var max = STU.length * (CKITEMS.length || 1);
  return { full: full, part: part, zero: zero,
    avgRate: max ? (sum / max) : 0, total: sum, max: max };
}
function todoStat(){
  var done = 0;
  for (var i = 0; i < TODOS.length; i++){ if (D.todoDone[TODOS[i].id]) done++; }
  return { done: done, total: TODOS.length,
    rate: TODOS.length ? done / TODOS.length : 0 };
}
function catOfTodos(){
  var o = [], m = {};
  for (var i = 0; i < TODOS.length; i++){
    var c = nz(TODOS[i].cat) || '其他';
    if (!m[c]){ m[c] = []; o.push(c); }
    m[c].push(TODOS[i]);
  }
  return { order: o, map: m };
}
function buildAttDates(){
  var ds = [], seen = {};
  for (var i = 0; i < PLAN.length; i++){
    var d = nz(PLAN[i]['日期']);
    if (d && !seen[d]){ seen[d] = 1; ds.push(d); }
  }
  if (!ds.length){
    for (var j = 0; j < DAILY.length; j++){
      if (DAILY[j].sessions && DAILY[j].sessions.length) ds.push(DAILY[j].iso);
    }
  }
  return ds;
}
function dailyByDate(dt){
  for (var i = 0; i < DAILY.length; i++){ if (DAILY[i].iso === dt) return DAILY[i]; }
  return null;
}
function dowOfDate(dt){
  for (var i = 0; i < PLAN.length; i++){ if (nz(PLAN[i]['日期']) === dt) return nz(PLAN[i]['星期']); }
  for (var j = 0; j < DAILY.length; j++){
    if (nz(DAILY[j].date).indexOf(dt) === 0 && DAILY[j].iso) return dowCN(DAILY[j].iso);
  }
  return '';
}
function todayDaily(){
  var t = todayISO(), d = dailyByDate(t);
  if (d) return d;
  for (var i = 0; i < DAILY.length; i++){
    if (DAILY[i].iso >= t && DAILY[i].sessions && DAILY[i].sessions.length) return DAILY[i];
  }
  return DAILY.length ? DAILY[0] : null;
}
function countdownInfo(){
  var t = todayISO();
  var s = D.settings.trainStart, e = D.settings.examStart;
  var toExam = diffDays(t, e);
  return { today: t, toExam: toExam, inRange: (t >= s && t <= e) };
}

/* ---------- 4. 通用渲染 ---------- */
var H = [];
function P(s){ H.push(s); }
function tblHtml(d){
  if (!d) return '';
  P('<div class="tw rt-wrap"><table class="rt">');
  if (d.head && d.head.length){
    P('<thead><tr>');
    for (var i = 0; i < d.head.length; i++) P('<th>' + nz(d.head[i]) + '</th>');
    P('</tr></thead>');
  }
  P('<tbody>');
  for (var r = 0; r < d.rows.length; r++){
    P('<tr>');
    var row = d.rows[r];
    for (var c = 0; c < row.length; c++){
      var lab = (d.head && d.head[c]) ? String(d.head[c]).replace(/["<>]/g, '') : '';
      P('<td data-l="' + lab + '">' + nz(row[c]) + '</td>');
    }
    P('</tr>');
  }
  P('</tbody></table></div>');
}
function blocksHtml(blocks){
  if (!blocks) return '';
  H = [];
  for (var i = 0; i < blocks.length; i++){
    var b = blocks[i];
    if (b.t === 'h3') P('<h3 class="bt">' + nz(b.c) + '</h3>');
    else if (b.t === 'h4') P('<h4 class="st">' + nz(b.c) + '</h4>');
    else if (b.t === 'p') P('<p>' + nz(b.c) + '</p>');
    else if (b.t === 'table') tblHtml(b.d);
    else if (b.t === 'ul'){
      P('<ul class="li">');
      for (var j = 0; j < b.items.length; j++) P('<li>' + nz(b.items[j]) + '</li>');
      P('</ul>');
    }
  }
  return H.join('');
}
function statBox(v, t){ return '<div class="stat"><b>' + v + '</b><span>' + t + '</span></div>'; }
function tip(cls, icon, title, body){
  return '<div class="tip ' + cls + '"><b>' + icon + ' ' + title + '</b><br>' + body + '</div>';

/* ---------- 8. 导出 / 备份 ---------- */
function csvText(rows){
  var out = [];
  for (var i = 0; i < rows.length; i++){
    var line = [];
    for (var c = 0; c < rows[i].length; c++){
      var s = (rows[i][c] === null || rows[i][c] === undefined) ? '' : String(rows[i][c]);
      if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      line.push(s);
    }
    out.push(line.join(','));
  }
  return '\uFEFF' + out.join('\r\n');
}
function download(name, content, mime){
  try {
    var blob = new Blob([content], { type: mime || 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 150);
    toast('已开始下载：' + name);
  } catch (e){
    showCopyPanel(content, name);
  }
}
function stamp(){
  var d = new Date();
  return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes());
}

  }

}

function exportAtt(){
  var rows = [['日期', '时段', '学号', '姓名', '组别', '出勤']];
  for (var d = 0; d < ATTDATES.length; d++){
    var dt = ATTDATES[d];
    var sl = ['上午', '下午'];
    for (var s = 0; s < sl.length; s++){
      var a = D.attendance[attKey(dt, sl[s])];
      if (!a) continue;
      for (var i = 0; i < STU.length; i++){
        var v = a[STU[i].sid];
        if (!v) continue;
        rows.push([dt, sl[s], STU[i].sid, STU[i].name, nz(STU[i].grp), v]);
      }

    for (var c = 0; c < CKITEMS.length; c++) line.push(row[c] ? '已完成' : '未完成');
    line.push(checkCount(s.sid));
    line.push(Math.round(checkRate(s.sid) * 100) + '%');
    rows.push(line);
  }
  download('周末打卡统计_' + stamp() + '.csv', csvText(rows));
}
function exportScore(){
  var rows = [['学号', '姓名', '组别', '耐久跑摸底', '耐久跑实测', '跳绳摸底', '跳绳实测', '坐位体前屈', '立定跳远', '备注']];
  for (var i = 0; i < STU.length; i++){
    var s = STU[i], sc = D.scores[s.sid] || {};
    rows.push([s.sid, s.name, nz(s.grp), nz(s.run), nz(sc.run), nz(s.rope), nz(sc.rope),
      nz(sc.sit), nz(sc.jump), nz(sc.note)]);
  }
  download('体测成绩录入_' + stamp() + '.csv', csvText(rows));
}
function exportTodo(){
  var rows = [['序号', '类别', '学号', '姓名', '现有记录', '要做什么', '是否已处理', '处理结果']];
  for (var i = 0; i < TODOS.length; i++){
    var o = TODOS[i];
    rows.push([o.id, o.cat, o.sid, o.name, nz(o.cur), nz(o.todo),
      D.todoDone[o.id] ? '已处理' : '未处理', nz(D.todoResult[o.id])]);
  }
  download('补测待办清单_' + stamp() + '.csv', csvText(rows));
}
function backup(){
  var payload = {
    app: 'pe-tc-workbench', version: 1,
    exportedAt: new Date().toISOString(),
    settings: D.settings, attendance: D.attendance, attNote: D.attNote,
    checkin: D.checkin, scores: D.scores, todoDone: D.todoDone, todoResult: D.todoResult
  };
  download('体测工作台备份_' + stamp() + '.json', JSON.stringify(payload, null, 1), 'application/json;charset=utf-8');
}
function doRestore(text){
  var o = null;
  try { o = JSON.parse(text); } catch (e){ toast('这个文件不是有效的备份文件'); return; }
  if (!o || o.app !== 'pe-tc-workbench'){
    toast('文件格式对不上，这不是本工作台的备份');
    return;
  }
  if (!confirm('恢复备份会【覆盖】当前录入的点名、打卡、成绩数据。\n\n确定要恢复吗？')) return;
  D.settings = o.settings || D.settings;
  D.attendance = o.attendance || {};
  D.attNote = o.attNote || {};
  D.checkin = o.checkin || {};
  D.scores = o.scores || {};
  D.todoDone = o.todoDone || {};
  D.todoResult = o.todoResult || {};
  ensureFields();
  save();
  closeModal();
  renderApp();
  toast('已恢复备份');
}
function clearAll(){
  if (!confirm('⚠️ 要清空你录入的全部数据吗？\n（点名记录、打卡、成绩、待办勾选都会被清掉）')) return;
  if (!confirm('再确认一次：真的要清空吗？\n\n建议先点「下载备份」存一份。')) return;
  D.attendance = {}; D.attNote = {}; D.checkin = {};
  D.scores = {}; D.todoDone = {}; D.todoResult = {};
  ensureFields();
  save();
  renderApp();
  toast('已清空录入数据（名单和方案保持不动）');
}

/* ---------- 9. 弹窗 / 剪贴板 ---------- */
function openModal(title, bodyHtml, footHtml){
  var host = $('modalHost');
  host.innerHTML = '<div class="modal"><div class="mh">' + title
    + '<span style="flex:1"></span><button class="x" data-act="closeModal">×</button></div>'
    + '<div class="mb">' + bodyHtml + '</div>'
    + (footHtml ? '<div class="mf">' + footHtml + '</div>' : '')
    + '</div>';
  host.classList.add('on');
}
function closeModal(){
  var host = $('modalHost');
  host.classList.remove('on');
  host.innerHTML = '';
}
function showCopyPanel(txt, name){
  openModal(name ? ('手动复制：' + esc(name)) : '手动复制',
    '<p class="muted" style="margin-bottom:8px">浏览器没让自动复制。别急 —— 点进下面这个框，全选（Ctrl+A），再复制（Ctrl+C）就行。</p>'
    + '<textarea id="copyArea" readonly>' + esc(txt) + '</textarea>',
    '<button class="btn g" data-act="selCopy">全选</button>'
    + '<button class="btn" data-act="closeModal">关闭</button>');
}
function copyText(txt){
  var ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt);
      ok = true;
    }
  } catch (e){ ok = false; }
  if (ok){ toast('已复制到剪贴板'); return; }
  try {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e){ ok = false; }
  if (ok){ toast('已复制到剪贴板'); return; }
  showCopyPanel(txt);
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2300);
}

/* ---------- 10. 事件 ---------- */
function findAct(node){
  var guard = 0;
  while (node && node !== document && guard < 60){
    if (node.getAttribute && node.getAttribute('data-act')) return node;
    node = node.parentNode;
    guard++;
  }
  return null;
}
document.addEventListener('click', function(e){
  var el = findAct(e.target);
  if (!el) return;
  var act = el.getAttribute('data-act');
  var sid, v, o;

  if (act === 'go'){ go(el.getAttribute('data-v')); return; }
  if (act === 'closeModal'){ closeModal(); return; }
  if (act === 'print'){ window.print(); return; }
  if (act === 'printPage'){
    go(el.getAttribute('data-v'));
    setTimeout(function(){ window.print(); }, 120);
    return;
  }

  if (act === 'att'){
    sid = el.getAttribute('data-sid'); v = el.getAttribute('data-v');
    var a = getAtt(UI.attendDate, UI.attendSlot);
    a[sid] = (a[sid] === v) ? '' : v;
    if (!a[sid]) delete a[sid];
    save();
    refreshAttRow(sid);
    refreshAttStat();
    return;
  }
  if (act === 'attAll'){
    var aa = getAtt(UI.attendDate, UI.attendSlot);
    for (var i = 0; i < STU.length; i++) aa[STU[i].sid] = '出';
    save();
    renderApp();
    toast('已把全班标记为出勤，再改缺勤的同学即可');
    return;
  }
  if (act === 'attClear'){
    if (!confirm('清空本节全部出勤标记？')) return;
    D.attendance[attKey(UI.attendDate, UI.attendSlot)] = {};
    save(); renderApp(); toast('已清空本节');
    return;
  }
  if (act === 'attPrev' || act === 'attNext'){
    var idx = ATTDATES.indexOf(UI.attendDate);
    idx += (act === 'attPrev' ? -1 : 1);
    if (idx < 0) idx = 0;
    if (idx > ATTDATES.length - 1) idx = ATTDATES.length - 1;
    UI.attendDate = ATTDATES[idx];
    renderApp();
    return;
  }
  if (act === 'attSlot'){ UI.attendSlot = el.getAttribute('data-v'); renderApp(); return; }

  if (act === 'ck'){
    sid = el.getAttribute('data-sid');
    var ci = parseInt(el.getAttribute('data-i'), 10);
    var row = checkRow(sid);
    row[ci] = row[ci] ? 0 : 1;
    save();
    el.classList.toggle('on');
    el.textContent = row[ci] ? '✓' : '';
    refreshCkRow(sid);
    refreshCkHead();
    return;
  }
  if (act === 'ckFilter'){ UI.ckFilter = el.getAttribute('data-v'); renderApp(); return; }

  if (act === 'rosterFilter'){ UI.rosterFilter = el.getAttribute('data-v'); renderApp(); return; }
  if (act === 'docCh'){ UI.docCh = parseInt(el.getAttribute('data-v'), 10); renderApp(); window.scrollTo(0, 0); return; }
  if (act === 'docAll'){ UI.docCh = -1; renderApp(); window.scrollTo(0, 0); return; }

  if (act === 'todoChk'){
    var id = el.getAttribute('data-id');
    D.todoDone[id] = !D.todoDone[id];
    if (!D.todoDone[id]) delete D.todoDone[id];
    save();
    renderApp();
    return;
  }

  if (act === 'backup'){ backup(); return; }
  if (act === 'restore'){
    openModal('恢复备份',
      '<p style="margin-bottom:9px">选择你之前下载的备份文件（<b>.json</b>）。恢复后当前数据会被覆盖。</p>'
      + '<input type="file" id="restoreFile" accept=".json,application/json" class="f" style="width:100%">',
      '<button class="btn g" data-act="closeModal">取消</button>');
    return;
  }
  if (act === 'clearAll'){ clearAll(); return; }
  if (act === 'selCopy'){
    var ca = $('copyArea');
    if (ca){ ca.focus(); ca.select(); }
    return;
  }
  if (act === 'exportRoster'){ exportRoster(); return; }
  if (act === 'exportAtt'){ exportAtt(); return; }
  if (act === 'exportCheck'){ exportCheck(); return; }
  if (act === 'exportScore'){ exportScore(); return; }
  if (act === 'exportTodo'){ exportTodo(); return; }
  if (act === 'copyRoster'){ copyText(rosterTSV()); return; }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var act = el.getAttribute('data-act');

  if (act === 'sc'){
    var sid = el.getAttribute('data-sid'), k = el.getAttribute('data-k');
    if (!D.scores[sid]) D.scores[sid] = {};
    D.scores[sid][k] = el.value;
    save();
    return;
  }
  if (act === 'todoRes'){
    var id = el.getAttribute('data-id');
    if (el.value) D.todoResult[id] = el.value; else delete D.todoResult[id];
    save();
    return;
  }
  if (el.id === 'attNote'){
    var nk = attKey(UI.attendDate, UI.attendSlot);
    if (el.value) D.attNote[nk] = el.value; else delete D.attNote[nk];
    save();
    return;
  }
  if (el.id === 'restoreFile'){
    var f = el.files && el.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){ doRestore(String(fr.result)); };
    fr.readAsText(f, 'utf-8');
    return;
  }
  if (el.id === 'inClass'){
    D.settings.className = el.value || '8年级4班';
    save();
    $('hTitle').textContent = D.settings.className + ' · 体测冲刺工作台';
    toast('班级名已更新');
    return;
  }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if (!el || !el.id) return;
  if (el.id === 'rosterKey'){
    UI.rosterKey = el.value;
    var listKey = el.value.trim().toLowerCase();
    var tbody = document.querySelector('#app table tbody');
    if (tbody){
      var list = STU.filter(function(s){
        if (UI.rosterFilter && (nz(s.grp) || '未分组') !== UI.rosterFilter) return false;
        if (!listKey) return true;
        return (nz(s.name).toLowerCase().indexOf(listKey) >= 0) || (String(s.sid).indexOf(listKey) >= 0);
      });
      var out = [];
      for (var i = 0; i < list.length; i++){
        var s = list[i];
        out.push('<tr><td class="c">' + esc(s.sid) + '</td><td><b>' + esc(s.name) + '</b></td><td class="c">' + esc(s.sex)
          + '</td><td class="c"><span class="pill ' + grpCls(s.grp) + '">' + esc(nz(s.grp) || '—') + '</span></td>'
          + '<td class="c">' + (nz(s.run) ? esc(s.run) : '<span class="muted">未测</span>') + '</td>'
          + '<td class="c">' + (nz(s.rope) ? esc(s.rope) : '<span class="muted">未测</span>') + '</td>'
          + '<td>' + esc(nz(s.pace) || '—') + '</td><td>' + esc(nz(s.rs) || '') + '</td>'
          + '<td>' + esc(nz(s.note) || '') + '</td></tr>');
      }
      tbody.innerHTML = out.join('') || '<tr><td colspan="9" class="c muted">没有匹配的人</td></tr>';
      var cnt = $('rosterCount');
      if (cnt) cnt.textContent = '当前显示 ' + list.length + ' 人';
    }
  }
});

/* ---------- 11. 初始化 ---------- */
function init(){
  load();
  buildAttDates();
  ATTDATES = buildAttDates();
  if (ATTDATES.length) UI.attendDate = ATTDATES[0];

  var cls = $('inClass');
  if (cls) cls.value = D.settings.className || '';
  var ht = $('hTitle');
  if (ht) ht.textContent = (D.settings.className || '8年级4班') + ' · 体测冲刺工作台';
  var hs = $('hSub');
  if (hs) hs.textContent = (D.settings.school || '') + ' · 冲刺期 ' + monthDay(D.settings.trainStart)
    + '—' + monthDay(D.settings.examStart);

  var qb = $('btnQuickBack'), qr = $('btnQuickRestore');
  if (qb) qb.onclick = function(){ backup(); };
  if (qr) qr.onclick = function(){ go('data'); openModal('恢复备份',
    '<input type="file" id="restoreFile" accept=".json,application/json" class="f" style="width:100%">',
    '<button class="btn g" data-act="closeModal">取消</button>'); };

  renderApp();
}

init();
</script>
