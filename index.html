<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>8年级4班 · 体测备考管理工作台</title>
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#101a2b; --sub:#5c6b83;
  --line:#dde4ee; --line2:#eef2f8;
  --brand:#0f766e; --brand2:#14b8a6; --blue:#1d4ed8; --blue2:#3b82f6;
  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
  --warn:#b45309; --warnbg:#fef3c7; --infobg:#e0f2fe; --info:#075985;
  --male:#1d4ed8; --malebg:#dbeafe; --fem:#7c3aed; --fembg:#ede9fe;
  --thin:#b45309; --thinbg:#fef3c7;
  --r:14px; --sh:0 1px 2px rgba(16,26,43,.06),0 6px 18px rgba(16,26,43,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:64px;
}
.hdr{background:linear-gradient(118deg,#0f766e 0%,#115e59 42%,#1e3a8a 100%);color:#fff;padding:14px 16px 12px}
.hdr .wrap{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .brand{display:flex;align-items:center;gap:10px;min-width:0}
.hdr .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:.2px}
.hdr .sub{font-size:12px;opacity:.82;margin-top:1px}
.hdr .sp{flex:1 1 auto}
.hdr .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr input.cls{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:8px;padding:5px 9px;font-size:13px;width:118px;font-family:inherit}
.hdr input.cls::placeholder{color:rgba(255,255,255,.6)}
.hdr .hb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;
  padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.hdr .hb:hover{background:rgba(255,255,255,.24)}
.main-nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:0 1px 3px rgba(16,26,43,.04)}
.main-nav .wrap{max-width:1120px;margin:0 auto;display:flex;gap:5px;overflow-x:auto;padding:7px 12px;scrollbar-width:thin}
.main-nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--sub);border-radius:9px;
  padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.main-nav button:hover{background:var(--line2);color:var(--ink)}
.main-nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:1120px;margin:0 auto;padding:16px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 17px;margin-bottom:14px}
.card.tight{padding:12px 13px}
.card>h2,.ct{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .n,.ct .n{background:var(--brand);color:#fff;font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:700}
.ct .s{font-size:12.5px;color:var(--sub);font-weight:400}
h3.bt{font-size:14.5px;font-weight:700;margin:14px 0 8px;color:var(--brand);padding-left:9px;border-left:3px solid var(--brand2)}
h4.st{font-size:13.5px;font-weight:700;margin:11px 0 6px;color:var(--ink)}
p{margin-bottom:9px}
.muted{color:var(--sub);font-size:13px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:9px 0 13px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th,td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f3f6fb;font-weight:700;color:#33425c;white-space:nowrap}
tr:last-child td{border-bottom:none}
th:last-child,td:last-child{border-right:none}
tbody tr:nth-child(even){background:#fafcfe}
table .c{text-align:center}
.pill{display:inline-block;border-radius:999px;padding:1.5px 9px;font-size:11.5px;font-weight:700;line-height:1.6;white-space:nowrap}
.p-a{background:#dcfce7;color:#15803d}
.p-b{background:var(--malebg);color:var(--male)}
.p-c{background:var(--thinbg);color:var(--thin)}
.p-f{background:var(--fembg);color:var(--fem)}
.p-w{background:#f1f5f9;color:#475569}
.p-d{background:#fee2e2;color:#b91c1c}
.p-x{background:#ede9fe;color:#6d28d9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:#f7fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--brand);line-height:1.25}
.stat span{font-size:12px;color:var(--sub)}
button.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:8px 15px;font-size:13.5px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
button.btn:hover{filter:brightness(1.08)}
button.btn.g{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
button.btn.b{background:var(--blue)}
button.btn.d{background:#fff;color:var(--bad);border:1.5px solid #f0b4b4}
button.btn.s{padding:5px 11px;font-size:12.5px;border-radius:8px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.toolbar .sp{flex:1}
input.f,select.f{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px;font-family:inherit;
  background:#fff;color:var(--ink);min-width:0}
input.f:focus,select.f:focus{outline:2px solid var(--brand2);outline-offset:-1px}
input.f.sm{padding:4px 7px;font-size:12.5px;border-radius:7px}
.tip{border-radius:11px;padding:11px 13px;font-size:13.2px;line-height:1.72;margin:10px 0;border:1px solid}
.tip.good{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.tip.warn{background:var(--warnbg);border-color:#fcd34d;color:#78350f}
.tip.info{background:var(--infobg);border-color:#bae6fd;color:#0c4a6e}
.tip.bad{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}
.tip b{font-weight:700}
.countdown{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(115deg,#0f766e,#115e59 55%,#1e3a8a);color:#fff;border-radius:var(--r);padding:17px 19px;box-shadow:var(--sh)}
.countdown .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.countdown .big small{font-size:15px;font-weight:600;opacity:.85;margin-left:3px}
.countdown .txt{font-size:13.5px;opacity:.93;line-height:1.66}
.seg{display:inline-flex;background:#f1f5f9;border-radius:9px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;border-radius:7px;padding:4px 11px;font-size:12.5px;cursor:pointer;
  font-family:inherit;color:var(--sub);font-weight:600}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(16,26,43,.1)}
.ab{border:1.2px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;font-size:12.5px;cursor:pointer;
  font-family:inherit;color:var(--sub);font-weight:700;margin-right:4px;min-width:32px}
.ab:hover{border-color:var(--brand2)}
.ab.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ab.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.ab.on-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.ab.on-info{background:var(--blue);border-color:var(--blue);color:#fff}
.ck{width:30px;height:26px;border:1.4px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;
  font-size:15px;line-height:1;color:#c3ccdb;font-family:inherit;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.big{width:auto;min-width:44px;height:30px;font-size:13px;padding:0 10px;font-weight:700}
.bar{height:9px;background:#e6ecf4;border-radius:999px;overflow:hidden;margin:7px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:999px;transition:width .25s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;
  cursor:pointer;font-family:inherit;color:var(--sub)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.to-do{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:#fff}
.to-do.done{background:#f6fdf8;border-color:#bbf7d0}
.to-do .cbx{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--line);background:#fff;cursor:pointer;
  flex:none;margin-top:1px;font-size:14px;color:#c3ccdb;font-family:inherit;padding:0}
.to-do .cbx.on{background:var(--ok);border-color:var(--ok);color:#fff}
.to-do .bd{flex:1;min-width:0}
.to-do .t1{font-weight:700;font-size:14px}
.to-do .t2{font-size:12.5px;color:var(--sub);margin-top:2px}
.to-do.done .t1{text-decoration:line-through;opacity:.62}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#101a2b;color:#fff;
  padding:10px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.24s;z-index:200;
  max-width:88vw;text-align:center}
#toast.show{opacity:.96;transform:translate(-50%,0)}
#modalHost{position:fixed;inset:0;background:rgba(12,18,30,.5);display:none;z-index:150;padding:18px;overflow:auto}
#modalHost.on{display:flex;align-items:flex-start;justify-content:center}
.modal{background:#fff;border-radius:16px;max-width:700px;width:100%;margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.modal .mh{padding:14px 17px;border-bottom:1px solid var(--line);font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px}
.modal .mb{padding:15px 17px;max-height:66vh;overflow:auto;font-size:13.6px}
.modal .mf{padding:12px 17px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#fafcfe;flex-wrap:wrap}
.modal textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;
  font-family:ui-monospace,Consolas,monospace;font-size:12.4px;line-height:1.6;resize:vertical;color:var(--ink)}
.x{background:transparent;border:none;font-size:21px;cursor:pointer;color:var(--sub);line-height:1;padding:0 4px;font-family:inherit}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:13.3px}
.kv b{color:var(--sub);font-weight:600}
ul.li,ol.li{margin:7px 0 11px 20px}
ul.li li,ol.li li{margin-bottom:5px;font-size:13.6px}
.print-only{display:none}
.foot{max-width:1120px;margin:0 auto;padding:14px 15px 0;color:var(--sub);font-size:12px;text-align:center;line-height:1.8}
/* ---- 日期带 ---- */
.dstrip{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 10px;scrollbar-width:thin}
.dchip{flex:none;min-width:76px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 9px;
  cursor:pointer;font-family:inherit;text-align:center;transition:.15s;line-height:1.35}
.dchip:hover{border-color:var(--brand2)}
.dchip.on{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(15,118,110,.25)}
.dchip.today{outline:2px solid #f59e0b;outline-offset:1px}
.dchip .m{font-size:14px;font-weight:800}
.dchip .w{font-size:11px;opacity:.78}
.dchip .k{font-size:10.5px;margin-top:2px;font-weight:700}
.dchip.k-weekend .k{color:#b45309}
.dchip.k-exam .k{color:#b91c1c}
.dchip.on .k,.dchip.on .w{color:#fff}
/* ---- 三组任务卡 ---- */
.gcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.gcard .ghead{font-size:13.5px;font-weight:800;padding:7px 12px;border-bottom:1px solid var(--line)}
.gcard .ghead .cnt{font-weight:600;font-size:11.5px;opacity:.8;margin-left:5px}
.gcard.gt-m .ghead{background:var(--malebg);color:var(--male)}
.gcard.gt-f .ghead{background:var(--fembg);color:var(--fem)}
.gcard.gt-w .ghead{background:var(--thinbg);color:var(--thin)}
.gcard .gnote{font-size:12px;color:var(--sub);padding:6px 12px;background:#fafcfe;border-bottom:1px solid var(--line2)}
.gcard table{font-size:12.8px}
.gcard td{border-right:none;padding:5px 12px}
.gcard tr.gtr td{border-top:1px dashed var(--line2);padding-top:2px;padding-bottom:7px;color:var(--sub);font-size:12.2px;line-height:1.6}
.gcard tr.gtr:last-child td{border-bottom:none}
.gcard td.gn{font-weight:700;width:52%;padding-bottom:0}
.gcard td.gs{text-align:right;color:var(--brand);font-weight:700;padding-bottom:0;white-space:pre-line}
.gcard tbody tr:nth-child(even){background:#fff}
/* ---- 执行勾选行 ---- */
.exrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:7px;background:#fff}
.exrow.on{background:#f6fdf8;border-color:#bbf7d0}
.exrow .lb{flex:1;min-width:0;font-size:13.6px;font-weight:700}
.exrow .lb small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:1px}
/* ---- 成绩表 ---- */
input.cellin,select.cellin{border:1px solid transparent;background:#f8fafc;border-radius:7px;padding:4px 6px;
  font-size:12.6px;font-family:inherit;color:var(--ink);width:100%;min-width:52px;text-align:center}
input.cellin:hover,select.cellin:hover{border-color:var(--line)}
input.cellin:focus,select.cellin:focus{outline:2px solid var(--brand2);outline-offset:-1px;background:#fff;text-align:left}
input.cellin.ok{background:#f0fdf4;color:#15803d;font-weight:700}
input.cellin.weak{background:#fef2f2;color:#b91c1c;font-weight:700}
.empty{color:#c3ccdb;font-style:normal}
.trend{font-weight:800;font-size:12.5px;white-space:nowrap}
.trend.up{color:#15803d}
.trend.down{color:#b91c1c}
.trend.flat{color:var(--sub)}
.weakrow td{background:#fff5f5!important}
.weakbadge{display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;margin-left:5px}
.okbadge{display:inline-block;background:#dcfce7;color:#15803d;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;margin-left:5px}
@media screen and (max-width:560px){
  .rt-wrap{border:none;margin:6px 0 4px}
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:auto;border:none}
  table.rt tr{border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:7px;background:#fff!important}
  table.rt td{padding:2px 0;font-size:13.2px;border-right:none}
  table.rt td:before{content:attr(data-l);display:inline-block;min-width:70px;font-weight:700;color:var(--brand);margin-right:7px;vertical-align:top}
  table.rt td:first-child{font-weight:700}
  table.rt td:first-child:before{color:var(--sub)}
}
@media screen and (max-width:520px){
  body{font-size:14.5px}
  main{padding:12px 10px 0}
  .card{padding:13px 12px}
  .hdr h1{font-size:15.5px}
  .hdr input.cls{width:96px}
  table{font-size:12.4px}
  th,td{padding:6px 7px}
  .countdown .big{font-size:36px}
  .dstrip{gap:6px}
  .dchip{min-width:68px;padding:6px 7px}
}
@media print{
  .main-nav,.hdr .ctrl,.toolbar,.no-print{display:none!important}
  body{background:#fff;font-size:10.5pt;padding:0}
  .card{box-shadow:none;border:1px solid #999;margin-bottom:8px;break-inside:auto}
  .print-only{display:block;font-size:10pt;color:#333;border-bottom:1px solid #999;padding-bottom:5px;margin-bottom:8px}
  .tw{overflow:visible;border-color:#999}
  table{font-size:9.6pt}
  th,td{padding:3px 6px}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{white-space:normal}
  th{white-space:normal}
  .pill,.ab,.ck,.to-do .cbx,.gcard .ghead,.stat{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dstrip{display:none}
  .pb{page-break-after:always}
  .pb:last-child{page-break-after:auto}
  a{color:#000;text-decoration:none}
  input.cellin,select.cellin{background:#fff!important;border:none;text-align:left;font-weight:400;color:#000}
  input.cellin.weak{color:#000}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <div class="brand">
      <div class="logo">🏃</div>
      <div>
        <h1 id="hTitle">8年级4班 · 体测备考管理工作台</h1>
        <div class="sub" id="hSub">广东省初中体测抽测 · 备考截止 10月26日</div>
      </div>
    </div>
    <div class="sp"></div>
    <div class="ctrl">
      <input class="cls" id="inClass" placeholder="班级名" title="可修改，回车生效">
      <button class="hb" id="btnQuickBack">备份</button>
      <button class="hb" id="btnQuickRestore">恢复</button>
    </div>
  </div>
</header>

<nav class="main-nav"><div class="wrap" id="mainNav"></div></nav>

<main id="app"></main>
<div class="foot" id="footNote"></div>

诉老师，不硬撑"},{"n":"测试当天","s":"心态","h":"满分不是标准，超越上一次的自己就是赢"}],"standards":{"caption":"下表为《国家学生体质健康标准》八年级及格线（60 分）/ 良好线（80 分），供现场对照。","rows":[{"item":"50 米跑","male":"9.9″","female":"10.8″","male80":"8.6″","female80":"9.4″","unit":"秒","lower":true},{"item":"1000 米（男）/ 800 米（女）","male":"5′05″","female":"4′50″","male80":"4′35″","female80":"4′20″","unit":"分秒","lower":true},{"item":"坐位体前屈","male":"-1.4","female":"2.9","male80":"7.3","female80":"11.4","unit":"厘米","lower":false},{"item":"立定跳远","male":"170","female":"144","male80":"196","female80":"169","unit":"厘米","lower":false},{"item":"引体向上（男）","male":"5","female":"—","male80":"9","female80":"—","unit":"个","lower":false},{"item":"1 分钟仰卧起坐（女）","male":"—","female":"21","male80":"—","female80":"33","unit":"个","lower":false}]},"strength":{"50 米跑":{"why":"占比最高的两项之一，技术性最强，而且只有一次机会。","plan":["起跑姿势固定下来：前脚距起跑线一脚半，重心稍前压。","每次跑都练“冲过终点线后再跑 5—8 米不减速”——单这一条就能快 0.1—0.3 秒。","摆臂前后摆、不左右横摆；30 米加速跑 6—8 组，隔天做。","测试前做 2 次 30 米加速跑唤醒，但别做多，避免腿酸。"]},"1000 米 / 800 米":{"why":"看着靠体力，其实全在配速和呼吸。多数学生前 200 米跟着冲、后 400 米走，比匀速慢 20—40 秒。","plan":["配速三段论：前 200 米略快不冲 → 中间匀速 → 最后 200—300 米加速。","呼吸三步一吸三步一呼，鼻吸口呼。","遇到极点时降速加深呼吸，不要停，30—60 秒就过去。","找人跟跑，把节奏交给前面的人。","测前 48 小时减量，把腿养足。"]},"坐位体前屈":{"why":"十天里最能提分的项目，每天拉伸就能涨 2—6 厘米。","plan":["每天 3 次拉伸（早读前 / 课间 / 睡前），腘绳肌、小腿、臀、竖脊肌各 30 秒 ×2—3 组。","呼气下压、吸气略松，慢慢加深；严禁上下弹震。","测前先热身，再用 PNF：压 6 秒 → 略松 → 再压更深，能多 2—4 厘米。","短时高频，不要一次压很久。"]},"立定跳远":{"why":"最容易丢分的地方是落地往后倒——成绩按最近落点算。","plan":["口诀练熟：预摆 → 屈膝下蹲手后摆 → 蹬地手前摆 → 展腹 → 收腹举腿 → 小腿前伸 → 脚跟先落 → 往前扑不倒。","专练“跳远 + 前扑”5 次，把往前扑变成肌肉记忆。","蛙跳 10—15 米 ×4 组，隔天做。","落地时向前走，绝不后退。"]},"引体向上":{"why":"七年级到九年级最难提的一项，不少男生 0 个。从 0 到 1 最陡，过了 1 到 5 反而快。","plan":["别一上来就硬拉，走五级阶梯：直臂悬垂 20—30 秒 ×3 → 屈臂悬垂 10—15 秒 ×3 → 弹力带辅助 ×3 → 慢下放 5 秒 ×5（最有效） → 完整 1 次。","课间每天 2—3 组悬垂，累计时间比单次强度重要。","不甩腿、下巴要过杠、下放不要直接松手。"]},"1 分钟仰卧起坐":{"why":"节奏和规范两难：前 30 秒冲太猛后 30 秒没劲，抱头拉脖子还伤颈椎。","plan":["配速：前 30 秒 22—25 个、后 30 秒 15—18 个，匀速比爆发划算。","手放耳侧或胸前，绝对不抱头。","中途不要停下来换气——一停就丢 3—5 秒。","每天 3 组 25 个，隔天做一次计时组。"]}},"altRules":[{"key":"哮喘","label":"哮喘 function esc(s){
  if (s === null || s === undefined) return '';

    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function iso(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){

}
function diffDays(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function monthDay(s){ var d = parseISO(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function dowCN(s){ return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][parseISO(s).getDay()]; }

/* ---------- 3. 计算核心 ---------- */
/* 学生运行时档案（只读访问不写盘） */
function stuD(sid){
  var o = D.stu[sid];
  if (!o){ o = {}; D.stu[sid] = o; }
  return o;
}
function stuDro(sid){ return D.stu[sid] || {}; }
function stuBase(sid){
  for (var i = 0; i < STU.length; i++){ if (String(STU[i].sid) === String(sid)) return STU[i]; }
  return null;
}
/* 组别：运行时优先，其次 seed 初值 */
function grpOf(sid){
  var o = stuDro(sid).grp;
  if (o) return o;
  var b = stuBase(sid);
  return b ? nz(b.grp) : '';
}
function sexOf(sid){
  var b = stuBase(sid);
  return b ? nz(b.sex) : '';
}
function nameOf(sid){ var b = stuBase(sid); return b ? nz(b.name) : ''; }
function lvOf(sid){ var b = stuBase(sid); return b ? nz(b.lv) : ''; }
function noteOf(sid){ var b = stuBase(sid); return b ? nz(b.note) : ''; }

/* 成绩数值：初始成绩取运行时（可录入），其次 seed 摸底值 */
function valOf(sid, k){
  var o = stuDro(sid);
  if (o[k] !== undefined && o[k] !== null && String(o[k]).trim() !== '') return String(o[k]).trim();
  var b = stuBase(sid);
  if (b && b[k] !== undefined && String(b[k]).trim() !== '') return String(b[k]).trim();
  return '';
}
/* 某一列（初始 / 某次模拟）的原始值 */
function valIn(sid, colId, k){
  if (colId === 'base') return valOf(sid, k);
  var s = simById(colId);
  if (!s) return '';
  var r = (s.res || {})[sid];
  if (!r) return '';
  return nz(r[k]);
}
function simById(id){
  for (var i = 0; i < D.sims.length; i++){ if (String(D.sims[i].id) === String(id)) return D.sims[i]; }
  return null;
}
function simColumns(){
  var c = [{ id: 'base', label: '初始成绩' }];
  for (var i = 0; i < D.sims.length; i++){
    c.push({ id: String(D.sims[i].id), label: nz(D.sims[i].label) || ('第 ' + (i + 1) + ' 次模拟') });
  }
  return c;
}
/* 数值解析
   设计原则：宁可返回 null（不确定），也不要猜错 —— 手写成绩单上有字迹不清的
   分数（如 4′0x″），一旦被解析成 4′00″ 就会误判为「达标」，把真实的薄弱项盖掉。 */
function stripNote(s){
  /* 去掉括号里的说明，如「4′64″（末位不清）」 */
  return nz(s).replace(/[（(][^）)]*[）)]/g, '').trim();
}
function parseRun(v){
  var s = stripNote(v);
  if (!s) return null;
  var m = s.match(/^(\d+)\s*[分'’′]\s*(\d+)\s*[秒″"”]?$/);
  if (m){
    var sec = parseInt(m[2], 10);
    if (sec >= 60) return null;   /* 秒数超过 59 属记错或字迹不清，不判 */
    return parseInt(m[1], 10) * 60 + sec;
  }
  m = s.match(/^(\d+)\s*[分'’′]\s*[秒″"”]?$/);
  if (m) return parseInt(m[1], 10) * 60;
  m = s.match(/^(\d+(?:\.\d+)?)\s*[秒″"”]?$/);
  if (m) return parseFloat(m[1]);
  return null;
}
function parseNum(v){
  var s = stripNote(v);
  if (!s) return null;
  var m = s.match(/^(-?\d+(?:\.\d+)?)/);
  if (!m) return null;
  var rest = s.slice(m[0].length).replace(/[\s\u2033\u201d"'\u2032\u00b0%]/g, '');
  if (rest && !/^[秒厘米个次分公斤名mlkgc]{0,4}$/i.test(rest)) return null;
  var n = parseFloat(m[1]);
  return isNaN(n) ? null : n;
}
function numOf(v, kind){ return kind === 'run' ? parseRun(v) : parseNum(v); }
/* 该项目对该生是否适用 */
function itemApplies(item, sex){
  if (item.sex && item.sex !== sex) return false;
  if (item.std.m === undefined && item.std.f === undefined) return false;
  return true;
}
/* 是否达标：返回 true / false / null（无法判断） */
function isPass(item, sex, v){
  var lim = item.std[sex === '男' ? 'm' : 'f'];
  if (lim === undefined) return null;
  var n = numOf(v, item.kind);
  if (n === null) return null;
  return item.lower ? (n <= lim) : (n >= lim);
}
/* 某生的薄弱项目列表 */
function weakOf(sid){
  var sex = sexOf(sid), o = [];
  for (var i = 0; i < ITEMS.length; i++){
    var it = ITEMS[i];
    if (it.ref || !itemApplies(it, sex)) continue;
    if (isPass(it, sex, valIn(sid, 'base', it.k)) === false) o.push(it);
  }
  return o;
}
/* 出勤键 */
function attKey(dt, slot){ return dt + '|' + slot; }
function getAtt(dt, slot, ro){
  var k = attKey(dt, slot);
  if (!D.attendance[k]){ if (ro) return {}; D.attendance[k] = {}; }
  return D.attendance[k];
}
function attStat(dt, slot){
  var a = getAtt(dt, slot, true), c = { '出': 0, '缺': 0, '病': 0, '事': 0, '未': 0 };
  for (var i = 0; i < STU.length; i++){
    var v = a[STU[i].sid];
    if (v && c[v] !== undefined) c[v]++; else c['未']++;
  }
  return c;
}
/* 出勤率（该生在所有已标记节次中的出勤占比） */
function attRate(sid){
  var tot = 0, ok = 0, k;
  for (k in D.attendance){
    var a = D.attendance[k]; if (!a) continue;
    var v = a[sid]; if (!v) continue;
    tot++; if (v === '出') ok++;
  }
  return tot ? (ok / tot) : null;
}
function attCount(sid){
  var tot = 0, ok = 0, ab = 0, k;
  for (k in D.attendance){
    var a = D.attendance[k]; if (!a) continue;
    var v = a[sid]; if (!v) continue;
    tot++; if (v === '出') ok++; else ab++;
  }
  return { tot: tot, ok: ok, ab: ab };
}
/* 执行勾选 */
function execRec(dt, slot, ro){
  var k = attKey(dt, slot);
  if (!D.exec[k]){ if (ro) return { note: '' }; D.exec[k] = { note: '' }; }
  return D.exec[k];
}
function execDone(dt, slot){
  var r = execRec(dt, slot, true), n = 0;
  for (var i = 0; i < EXKEYS.length; i++){ if (r[EXKEYS[i]]) n++; }
  return { n: n, total: EXKEYS.length, rate: n / EXKEYS.length };
}
/* 打卡 */
function ckRow(wk, sid, ro){
  if (!D.checkin[wk]){ if (ro) return emptyRow(); D.checkin[wk] = {}; }
  var r = D.checkin[wk][sid];
  if (!(r instanceof Array)){
    if (ro) return emptyRow();
    r = emptyRow(); D.checkin[wk][sid] = r;
  }
  while (r.length < CKITEMS.length) r.push(0);
  return r;
}
function emptyRow(){ var t = [], i; for (i = 0; i < CKITEMS.length; i++) t.push(0); return t; }
function ckCount(wk, sid){
  var r = ckRow(wk, sid, true), n = 0;
  for (var i = 0; i < CKITEMS.length; i++){ if (r[i]) n++; }
  return n;
}
function ckRate(wk, sid){ return ckCount(wk, sid) / (CKITEMS.length || 1); }
function ckTotals(wk, list){
  var full = 0, part = 0, zero = 0, sum = 0, arr = list || STU;
  for (var i = 0; i < arr.length; i++){
    var n = ckCount(wk, arr[i].sid);
    sum += n;
    if (n === CKITEMS.length) full++; else if (n === 0) zero++; else part++;
  }
  var max = arr.length * (CKITEMS.length || 1);
  return { full: full, part: part, zero: zero, avg: max ? sum / max : 0, total: arr.length };
}
/* 待办 */
function todoStat(){
  var done = 0;
  for (var i = 0; i < TODOS.length; i++){ if (D.todoDone[todoId(TODOS[i], i)]) done++; }
  return { done: done, total: TODOS.length, rate: TODOS.length ? done / TODOS.length : 0 };
}
function todoId(o, i){ return String(o.id !== undefined ? o.id : ('t' + i)); }
/* 日历 */
function dayByISO(s){
  for (var i = 0; i < DAYS.length; i++){ if (DAYS[i].iso === s) return DAYS[i]; }
  return null;
}
function trainDays(){
  var o = [];
  for (var i = 0; i < DAYS.length; i++){ if (DAYS[i].kind === 'train') o.push(DAYS[i]); }
  return o;
}
function todayDay(){
  var t = todayISO(), d = dayByISO(t);
  if (d) return d;
  for (var i = 0; i < DAYS.length; i++){ if (DAYS[i].iso >= t) return DAYS[i]; }
  return DAYS.length ? DAYS[0] : null;
}
function countdownInfo(){
  var t = todayISO(), e = D.settings.examDate;
  return { today: t, toExam: diffDays(t, e), inRange: (t >= D.settings.startDate && t <= e) };
}
/* 阶段自动调整：越靠近 10/26，完整模拟频次越高 */
function phaseInfo(){
  var left = countdownInfo().toExam;
  if (left > 6) return { n: '基础期', tip: '还剩 ' + left + ' 天：打基础，把动作规范和数据补齐。本阶段不安排完整模拟，只做分项小测。', sim: '本周建议：0 次完整模拟' };
  if (left > 3) return { n: '强化期', tip: '还剩 ' + left + ' 天：专项强化，薄弱项优先。每 2—3 天安排一次半程模拟（3—4 个项目）。', sim: '建议：每 2—3 天一次半程模拟' };
  if (left > 0) return { n: '模拟期 / 减量期', tip: '还剩 ' + left + ' 天：安排完整模拟，按正式流程走；同时开始减量——测前 48 小时不做高强度。', sim: '建议：安排 1 次完整模拟，之后减量' };
  if (left === 0) return { n: '体测期', tip: '就是今天：保持轻量活动，充分热身，按「体测当天注意事项」一条条过。', sim: '不再安排模拟' };
  return { n: '体测期', tip: '体测周已开始：保状态、保睡眠，不新增训练量。', sim: '不再安排模拟' };
}
/* 全班薄弱项排行 */
function weakRank(scopeList){
  var arr = scopeList || STU, cnt = {}, i, j;
  for (i = 0; i < ITEMS.length; i++){ if (!ITEMS[i].ref) cnt[ITEMS[i].k] = 0; }
  var per = [];
  for (i = 0; i < arr.length; i++){
    var w = weakOf(arr[i].sid);
    var names = [];
    for (j = 0; j < w.length; j++){ cnt[w[j].k]++; names.push(w[j].n); }
    per.push({ sid: arr[i].sid, name: nameOf(arr[i].sid), grp: grpOf(arr[i].sid), weak: names });
  }
  var rank = [];
  for (i = 0; i < ITEMS.length; i++){
    if (ITEMS[i].ref) continue;
    rank.push({ k: ITEMS[i].k, n: ITEMS[i].n, c: cnt[ITEMS[i].k] || 0 });
  }
  rank.sort(function(a, b){ return b.c - a.c; });
  return { rank: rank, per: per, total: arr.length };
}
function scopeList(){
  if (UI.anaScope === 'grp' && UI.anaGrp){
    return STU.filter(function(s){ return grpOf(s.sid) === UI.anaGrp; });
  }

  return STU;
}
function grpList(){

  for (i = 0; i < STU.length; i++){

}

function rosterRows(list){

  }
  return out.join('');

/* 薄弱项单元格：区分「未达标」「还没测」「全部达标」三种情况 */
function weakCellHtml(sid){
  var sex = sexOf(sid), w = weakOf(sid), appl = 0, tested = 0, i;
  for (i = 0; i < ITEMS.length; i++){
    var it = ITEMS[i];
    if (it.ref || !itemApplies(it, sex)) continue;
    appl++;
    if (valOf(sid, it.k)) tested++;
  }
  if (w.length){
    var names = [];
    for (i = 0; i < w.length; i++) names.push(w[i].n);
    return '<span class="pill p-d">' + w.length + ' 项未达标</span> <span class="muted">' + esc(names.join('、')) + '</span>';
  }
  if (tested < appl) return '<span class="pill p-w">还没测（' + (appl - tested) + ' 项）</span>';
  return '<span class="pill p-a">全部达标</span>';
}
function grpOpts(cur){
  var o = ['<option value="">—</option>'];
  for (var i = 0; i < GRPS.length; i++){
    o.push('<option value="' + esc(GRPS[i]) + '"' + (cur === GRPS[i] ? ' selected' : '') + '>' + esc(GRPS[i]) + '</option>');

}

    + '<button class="btn g s" data-act="expScore">⬇ 导出全部成绩（CSV）</button> '
    + '<button class="btn g s" data-act="print">🖨 打印本页</button></div>');
  return h.join('');
}
function trendHtml(first, last, lower){
  if (first === null || last === null) return '<span class="trend flat">—</span>';
  var d = last - first;
  if (Math.abs(d) < 0.0001) return '<span class="trend flat">持平</span>';
  var better = lower ? (d < 0) : (d > 0);
  var arrow = d > 0 ? '↑' : '↓';
  return '<span class="trend ' + (better ? 'up' : 'down') + '">' + arrow + Math.abs(Math.round(d * 100) / 100) + '</span>';
}

/* ---------- 16. 导出 / 备份 ---------- */
function csvText(rows){
  var out = [], i, c;
  for (i = 0; i < rows.length; i++){
    var line = [];
    for (c = 0; c < rows[i].length; c++){
      var s = (rows[i][c] === null || rows[i][c] === undefined) ? '' : String(rows[i][c]);
      if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      line.push(s);
    }
    out.push(line.join(','));
  }
  return '\uFEFF' + out.join('\r\n');
}
function download(name, content, mime){
  try {
    var blob = new Blob([content], { type: mime || 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 150);
    toast('已开始下载：' + name);
  } catch (e){ showCopyPanel(content, name); }
}

  var d = new Date();

}

  var rows = [head];
  for (i = 0; i < STU.length; i++){
    var sid = STU[i].sid, line = [sid, nameOf(sid), grpOf(sid)];
    for (j = 0; j < ITEMS.length; j++){
      for (var c = 0; c < cols.length; c++){
        line.push(valIn(sid, cols[c].id, ITEMS[j].k));
      }
    }
    rows.push(line);
  }
  download('体测成绩总表_' + stamp() + '.csv', csvText(rows));
}
function expAtt(){
  var rows = [['日期', '时段', '学号', '姓名', '组别', '出勤']], k;
  var dayList = [];
  for (var i = 0; i < DAYS.length; i++){ if (DAYS[i].kind === 'train') dayList.push(DAYS[i].iso); }
  for (var d = 0; d < dayList.length; d++){
    var sl = ['上午', '下午'];
    for (var s = 0; s < sl.length; s++){
      var a = D.attendance[attKey(dayList[d], sl[s])];
      if (!a) continue;
      for (var j = 0; j < STU.length; j++){
        var v = a[STU[j].sid];
        if (!v) continue;
        rows.push([dayList[d], sl[s], STU[j].sid, nameOf(STU[j].sid), grpOf(STU[j].sid), v]);
      }
    }
  }
  if (rows.length === 1){ toast('还没有点名记录可导出'); return; }
  download('出勤记录_' + stamp() + '.csv', csvText(rows));
}
function expCheck(){
  var wk = UI.ckWk || '1', i, j;
  var head = ['学号', '姓名', '组别'];
  for (i = 0; i < CKITEMS.length; i++) head.push(CKITEMS[i]);
  head.push('完成项数', '完成率');
  var rows = [head];
  for (i = 0; i < STU.length; i++){
    var sid = STU[i].sid, row = ckRow(wk, sid, true), line = [sid, nameOf(sid), grpOf(sid)];
    for (j = 0; j < CKITEMS.length; j++) line.push(row[j] ? '已完成' : '未完成');
    line.push(ckCount(wk, sid));
    line.push(Math.round(ckRate(wk, sid) * 100) + '%');
    rows.push(line);
  }
  download('周末打卡统计_' + wk + '_' + stamp() + '.csv', csvText(rows));
}
function expTodo(){
  var rows = [['序号', '要确认的事', '涉及学生', '现有记录', '是否已处理', '处理结果']];
  for (var i = 0; i < TODOS.length; i++){
    var o = TODOS[i], id = todoId(o, i);
    rows.push([id, nz(o.t) || nz(o.todo), nz(o.name), nz(o.cur),
      D.todoDone[id] ? '已处理' : '未处理', nz(D.todoResult[id])]);
  }
  download('待补测清单_' + stamp() + '.csv', csvText(rows));
}
function expSafety(){
  var rows = [['学号', '姓名', '组别', '特殊情况', '伤病备注', '替代训练方案']];
  for (var i = 0; i < STU.length; i++){
    var sid = STU[i].sid, o = stuDro(sid);
    if (!nz(o.special) && !nz(o.injury)) continue;
    var r = altRuleOf(nz(o.special));
    rows.push([sid, nameOf(sid), grpOf(sid), r ? r.label : '', nz(o.injury), nz(o.alt)]);
  }
  if (rows.length === 1){ toast('还没有登记特殊情况'); return; }
  download('特殊情况名单_' + stamp() + '.csv', csvText(rows));
}
function backup(){
  var payload = {
    app: 'pe-tc-calendar-workbench', version: 1,
    exportedAt: new Date().toISOString(),
    settings: D.settings, stu: D.stu, sims: D.sims,
    attendance: D.attendance, attNote: D.attNote, exec: D.exec,
    checkin: D.checkin, todoDone: D.todoDone, todoResult: D.todoResult
  };
  download('体测工作台备份_' + stamp() + '.json', JSON.stringify(payload, null, 1), 'application/json;charset=utf-8');
}
function doRestore(text){
  var o = null;
  try { o = JSON.parse(text); } catch (e){ toast('这个文件不是有效的备份文件'); return; }
  if (!o || o.app !== 'pe-tc-calendar-workbench'){
    toast('文件格式对不上，这不是本工作台的备份');
    return;
  }
  if (!confirm('恢复备份会【覆盖】当前录入的档案、成绩、点名、打卡数据。\n\n确定要恢复吗？')) return;
  D.settings = o.settings || D.settings;
  D.stu = o.stu || {};
  D.sims = o.sims || [];
  D.attendance = o.attendance || {};
  D.attNote = o.attNote || {};
  D.exec = o.exec || {};
  D.checkin = o.checkin || {};
  D.todoDone = o.todoDone || {};
  D.todoResult = o.todoResult || {};
  ensureFields();
  save();
  closeModal();
  renderApp();
  toast('已恢复备份');
}
function clearAll(){
  if (!confirm('⚠️ 要清空你录入的全部数据吗？\n（学生档案、成绩、模拟测试、点名、打卡、待办都会被清掉）')) return;
  if (!confirm('再确认一次：真的要清空吗？\n\n建议先点「下载备份」存一份。')) return;
  D.stu = {}; D.sims = []; D.attendance = {}; D.attNote = {}; D.exec = {};
  D.checkin = {}; D.todoDone = {}; D.todoResult = {};
  ensureFields();
  save();
  renderApp();
  toast('已清空录入数据（名单和训练方案保持不动）');
}
/* 打卡清单文本（发群用） */
function checkText(wk){
  var H2 = HOMEWORK[wk];
  if (!H2) return '';
  var L = [];
  L.push('【' + H2.title + '】');
  L.push(D.settings.className + ' 体育周末家庭作业');
  L.push('');
  L.push(H2.intro);
  for (var g = 0; g < H2.groups.length; g++){
    L.push('');
    L.push('■ ' + H2.groups[g].g);
    for (var j = 0; j < H2.groups[g].items.length; j++){
      var it = H2.groups[g].items[j];
      /* 规格里可能带换行（如「心肺耐力」的两个方案）——复制成文本时并回一行，避免断得难看 */
      L.push('　' + (j + 1) + '. ' + it.n + '｜' + it.s.replace(/\n/g, '　'));
      L.push('　　' + it.h);
    }
  }
  L.push('');
  L.push('【打卡要求】');
  for (var i = 0; i < CKITEMS.length; i++) L.push('　☐ ' + CKITEMS[i] + '：' + (CKDESC[i] || ''));
  L.push('');
  L.push('【安全提醒】');
  for (var k = 0; k < (H2.tips || []).length; k++) L.push('　· ' + H2.tips[k]);
  L.push('');
  L.push('练前热身、练后拉伸；身体不适立即停止并告诉老师。');
  return L.join('\r\n');
}

/* ---------- 17. 弹窗 / 剪贴板 ---------- */
function openModal(title, bodyHtml, footHtml){
  var host = $('modalHost');
  host.innerHTML = '<div class="modal"><div class="mh">' + title
    + '<span style="flex:1"></span><button class="x" data-act="closeModal">×</button></div>'
    + '<div class="mb">' + bodyHtml + '</div>'
    + (footHtml ? '<div class="mf">' + footHtml + '</div>' : '')
    + '</div>';
  host.classList.add('on');
}
function closeModal(){
  var host = $('modalHost');
  host.classList.remove('on');
  host.innerHTML = '';
}
function showCopyPanel(txt, name){
  openModal(name ? ('手动复制：' + esc(name)) : '手动复制',
    '<p class="muted" style="margin-bottom:8px">浏览器没让自动复制。别急 —— 点进下面这个框，全选（Ctrl+A），再复制（Ctrl+C）就行。</p>'
    + '<textarea id="copyArea" readonly>' + esc(txt) + '</textarea>',
    '<button class="btn g" data-act="selCopy">全选</button>'
    + '<button class="btn" data-act="closeModal">关闭</button>');
}
function copyText(txt){
  var ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt);
      ok = true;
    }
  } catch (e){ ok = false; }
  if (ok){ toast('已复制到剪贴板'); return; }
  try {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e){ ok = false; }
  if (ok){ toast('已复制到剪贴板'); return; }
  showCopyPanel(txt);
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2300);
}
function findAct(node){
  var guard = 0;
  while (node && node !== document && guard < 60){
    if (node.getAttribute && node.getAttribute('data-act')) return node;
    node = node.parentNode;
    guard++;
  }
  return null;
}

/* ---------- 18. 事件 ---------- */
document.addEventListener('click', function(e){
  var el = findAct(e.target);
  if (!el) return;
  var act = el.getAttribute('data-act');
  var sid, v, i, o;

  if (act === 'go'){ go(el.getAttribute('data-v')); return; }
  if (act === 'closeModal'){ closeModal(); return; }
  if (act === 'print'){ window.print(); return; }
  if (act === 'printPage'){
    go(el.getAttribute('data-v'));
    setTimeout(function(){ window.print(); }, 130);
    return;
  }
  if (act === 'printAtt'){ go('printatt'); setTimeout(function(){ window.print(); }, 130); return; }
  if (act === 'printCheck'){ UI.printWk = el.getAttribute('data-v') || '1'; go('printcheck'); setTimeout(function(){ window.print(); }, 130); return; }
  if (act === 'printTrunk'){ go('printtrunk'); setTimeout(function(){ window.print(); }, 130); return; }
  if (act === 'selCopy'){ var ca = $('copyArea'); if (ca){ ca.focus(); ca.select(); } return; }

  /* 日历 */
  if (act === 'calDay'){ UI.calDay = el.getAttribute('data-v'); renderApp(); return; }

  /* 执行 */
  if (act === 'exSlot'){ UI.execSlot = el.getAttribute('data-v'); renderApp(); return; }
  if (act === 'exPrev' || act === 'exNext'){
    var days = trainDays(), cur = UI.execDay;
    if (!cur){ var td = todayDay(); cur = (td && td.kind === 'train') ? td.iso : days[0].iso; }
    var idx = 0;
    for (i = 0; i < days.length; i++){ if (days[i].iso === cur) idx = i; }
    idx += (act === 'exPrev' ? -1 : 1);
    if (idx < 0) idx = 0;
    if (idx > days.length - 1) idx = days.length - 1;
    UI.execDay = days[idx].iso;
    UI.execSlot = 'am';
    renderApp();
    return;
  }
  if (act === 'exChk'){
    var k2 = el.getAttribute('data-k');
    var rec = execRec(UI.execDay, UI.execSlot);
    rec[k2] = rec[k2] ? 0 : 1;
    if (!rec[k2]) delete rec[k2];
    save();
    renderApp();
    return;
  }

  /* 学生档案 */
  if (act === 'rosterGrp'){ UI.rosterGrp = el.getAttribute('data-v'); renderApp(); return; }
  if (act === 'stuOpen'){ stuModal(el.getAttribute('data-sid')); return; }
  if (act === 'genAlt'){ genAlt(el.getAttribute('data-sid')); return; }
  if (act === 'attOpen'){ UI.attDate = ''; attPanel(); return; }
  if (act === 'attSlot'){ UI.attSlot = el.getAttribute('data-v'); attPanel(); return; }
  if (act === 'att'){
    sid = el.getAttribute('data-sid'); v = el.getAttribute('data-v');
    var a = getAtt(UI.attDate, UI.attSlot);
    a[sid] = (a[sid] === v) ? '' : v;
    if (!a[sid]) delete a[sid];
    save();
    refreshAttRow(sid);
    refreshAttStat();
    return;
  }
  if (act === 'attAll'){
    var aa = getAtt(UI.attDate, UI.attSlot);
    for (i = 0; i < STU.length; i++) aa[STU[i].sid] = '出';
    save(); attPanel(); toast('已把全班标记为出勤，再改缺勤的同学即可');
    return;
  }
  if (act === 'attClear'){
    if (!confirm('清空本节全部出勤标记？')) return;
    D.attendance[attKey(UI.attDate, UI.attSlot)] = {};
    save(); attPanel(); toast('已清空本节');
    return;
  }

  /* 成绩分析 */
  if (act === 'anaScope'){ UI.anaScope = el.getAttribute('data-v'); renderApp(); return; }
  if (act === 'simAdd'){ simAdd(); return; }
  if (act === 'simDel'){ simDel(); return; }

  /* 打卡 */
  if (act === 'ckWk'){ UI.ckWk = el.getAttribute('data-v'); renderApp(); return; }
  if (act === 'ckFilter'){ UI.ckFilter = el.getAttribute('data-v'); renderApp(); return; }
  if (act === 'ck'){
    var wk = el.getAttribute('data-wk');
    sid = el.getAttribute('data-sid');
    i = parseInt(el.getAttribute('data-i'), 10);
    var row = ckRow(wk, sid);
    row[i] = row[i] ? 0 : 1;
    save();
    el.classList.toggle('on');
    el.textContent = row[i] ? '✓' : '';
    refreshCkRow(sid);
    refreshCkHead();
    return;
  }
  if (act === 'copyCheck'){ copyText(checkText(el.getAttribute('data-v') || '1')); return; }
  if (act === 'copyHw'){ copyText(checkText(el.getAttribute('data-v') || '1')); return; }

  /* 安全预警 */
  if (act === 'safetyOpen'){
    if (UI.safetySid) stuModal(UI.safetySid);
    return;
  }
  if (act === 'safetyDel'){
    sid = el.getAttribute('data-sid');
    if (!confirm('清除这位同学的特殊情况与替代方案？')) return;
    var so = stuD(sid);
    so.special = ''; so.alt = '';
    save(); renderApp(); toast('已清除');
    return;
  }

  /* 待办 */
  if (act === 'todoChk'){
    var id = el.getAttribute('data-id');
    D.todoDone[id] = !D.todoDone[id];
    if (!D.todoDone[id]) delete D.todoDone[id];
    save(); renderApp();
    return;
  }

  /* 训练要点 */
  if (act === 'tipsCh'){ UI.tipsCh = parseInt(el.getAttribute('data-v'), 10); renderApp(); return; }

  /* 系统 */
  if (act === 'backup'){ backup(); return; }
  if (act === 'restore'){
    openModal('恢复备份',
      '<p style="margin-bottom:9px">选择你之前下载的备份文件（<b>.json</b>）。恢复后当前数据会被覆盖。</p>'
      + '<input type="file" id="restoreFile" accept=".json,application/json" class="f" style="width:100%">',
      '<button class="btn g" data-act="closeModal">取消</button>');
    return;
  }
  if (act === 'clearAll'){ clearAll(); return; }
  if (act === 'expRoster'){ expRoster(); return; }
  if (act === 'expScore'){ expScore(); return; }
  if (act === 'expAtt'){ expAtt(); return; }
  if (act === 'expCheck'){ expCheck(); return; }
  if (act === 'expTodo'){ expTodo(); return; }
  if (act === 'expSafety'){ expSafety(); return; }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var act = el.getAttribute('data-act');

  if (act === 'sc'){
    var sid = el.getAttribute('data-sid'), k = el.getAttribute('data-k');
    var o = stuD(sid);
    o[k] = el.value;
    save();
    refreshRosterRow(sid);
    return;
  }
  if (act === 'stuGrp'){
    var sid2 = el.getAttribute('data-sid');
    var o2 = stuD(sid2);
    if (el.value) o2.grp = el.value; else delete o2.grp;
    save();
    toast('已把 ' + nameOf(sid2) + ' 调到 ' + (el.value || '未分组'));
    renderApp();
    return;
  }
  if (act === 'stuField'){
    var sid3 = el.getAttribute('data-sid'), k3 = el.getAttribute('data-k');
    var o3 = stuD(sid3);
    o3[k3] = el.value;
    save();
    toast('已保存');
    if (k3 === 'special') { /* 选了类型后提示生成 */ }
    return;
  }
  if (act === 'attDate'){ UI.attDate = el.value; attPanel(); return; }
  if (act === 'anaGrp'){ UI.anaGrp = el.value; renderApp(); return; }
  if (act === 'anaSid'){ UI.anaSid = el.value; renderApp(); return; }
  if (act === 'safetySid'){ UI.safetySid = el.value; renderApp(); return; }
  if (act === 'todoRes'){
    var tid = el.getAttribute('data-id');
    if (el.value) D.todoResult[tid] = el.value; else delete D.todoResult[tid];
    save();
    return;
  }
  if (el.id === 'exNote'){
    var r = execRec(UI.execDay, UI.execSlot);
    if (el.value) r.note = el.value; else r.note = '';
    save();
    return;
  }
  if (el.id === 'attNote'){
    var nk = attKey(UI.attDate, UI.attSlot);
    if (el.value) D.attNote[nk] = el.value; else delete D.attNote[nk];
    save();
    return;
  }
  if (el.id === 'restoreFile'){
    var f = el.files && el.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){ doRestore(String(fr.result)); };
    fr.readAsText(f, 'utf-8');
    return;
  }
  if (el.id === 'inClass'){
    D.settings.className = el.value || '8年级4班';
    save();
    $('hTitle').textContent = D.settings.className + ' · 体测备考管理工作台';
    toast('班级名已更新');
    return;
  }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if (!el || !el.id) return;
  if (el.id === 'rosterKey'){
    UI.rosterKey = el.value;
    var key = el.value.trim().toLowerCase();
    var list = STU.filter(function(s){
      if (UI.rosterGrp && grpOf(s.sid) !== UI.rosterGrp) return false;
      if (!key) return true;
      return (nz(s.name).toLowerCase().indexOf(key) >= 0) || (String(s.sid).indexOf(key) >= 0);
    });
    var tb = document.querySelector('#rosterTbl tbody');
    if (tb){
      tb.innerHTML = rosterRows(list) || '<tr><td colspan="13" class="c muted">没有匹配的人</td></tr>';
      var cnt = $('rosterCount');
      if (cnt) cnt.textContent = '当前显示 ' + list.length + ' 人';
    }
  }
});

/* ---------- 19. 业务动作 ---------- */
function genAlt(sid){
  var o = stuD(sid);
  var key = nz(o.special);
  if (!key){ toast('先在上面选一下「特殊情况」'); return; }
  var rule = altRuleOf(key);
  if (!rule){ toast('没找到对应的替代方案'); return; }
  var L = [];
  L.push('【' + nameOf(sid) + '】替代训练方案（' + rule.label + '）');
  L.push('适用原则：' + rule.advice);
  L.push('');
  for (var i = 0; i < rule.swap.length; i++){
    L.push('· ' + rule.swap[i].n + ' → ' + rule.swap[i].s);
    L.push('　' + rule.swap[i].h);
  }
  L.push('');
  L.push('每节课仍然要参加热身与放松拉伸（可降低幅度），全程在老师视线范围内。');
  o.alt = L.join('\n');
  save();
  stuModal(sid);
  toast('已生成替代训练方案');
}
function simAdd(){
  var t = todayISO();
  if (D.sims.length){
    var last = D.sims[D.sims.length - 1];
    if (last.date === t){
      toast('今天已经建过一次模拟了');
      return;
    }
  }
  var id = 'sim' + (new Date().getTime());
  D.sims.push({ id: id, date: t, label: '第 ' + (D.sims.length + 1) + ' 次模拟（' + monthDay(t) + '）', res: {} });
  save();
  UI.anaScope = 'one';
  if (STU.length && !UI.anaSid) UI.anaSid = STU[0].sid;
  renderApp();
  toast('已新建模拟：去表格里填成绩吧');
}
function simDel(){
  var s = D.sims[D.sims.length - 1];
  if (!s) return;
  if (!confirm('删除「' + s.label + '」这次模拟的全部成绩？')) return;
  D.sims.pop();
  save();
  renderApp();
  toast('已删除');
}

/* ---------- 20. 初始化 ---------- */
function init(){
  load();
  var cls = $('inClass');
  if (cls) cls.value = D.settings.className || '';
  var ht = $('hTitle');
  if (ht) ht.textContent = (D.settings.className || '8年级4班') + ' · 体测备考管理工作台';
  var hs = $('hSub');
  if (hs) hs.textContent = (D.settings.school || '') + ' · 备考截止 ' + monthDay(D.settings.examDate)
    + '（' + dowCN(D.settings.examDate) + '）· 上午 ' + D.settings.amTime + ' / 下午 ' + D.settings.pmTime;

  var qb = $('btnQuickBack'), qr = $('btnQuickRestore');
  if (qb) qb.onclick = function(){ backup(); };
  if (qr) qr.onclick = function(){
    openModal('恢复备份',
      '<p style="margin-bottom:9px">选择你之前下载的备份文件（<b>.json</b>）。</p>'
      + '<input type="file" id="restoreFile" accept=".json,application/json" class="f" style="width:100%">',
      '<button class="btn g" data-act="closeModal">取消</button>');
  };
  var td = todayDay();
  UI.calDay = td ? td.iso : (DAYS.length ? DAYS[0].iso : '');
  renderApp();
}

init();
